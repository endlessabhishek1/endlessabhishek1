name: generate snake

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: endlessabhishek1
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%23FF0080
            dist/snake-light.svg?palette=github-light&color_snake=%237928CA
            dist/snake.gif?color_snake=%2300DFD8&color_dots=%23FF0080,%237928CA,%2300DFD8,%23ffffff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
